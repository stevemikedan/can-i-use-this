# Handoff link templates. Substituted over resolved identifiers (requires_scheme
# = an Identifier.scheme) or over query facts (requires_scheme = title | artist
# | year). Tiers per schemas.LinkTier: deep_link, prefilled_search, guided_manual.

- name: MusicBrainz recording
  tier: deep_link
  url_template: "https://musicbrainz.org/recording/{value}"
  requires_scheme: musicbrainz_recording
  applicable_types: [music]
  purpose: verify
  description: "The recording entity this determination is based on"
  authoritative: false

- name: MusicBrainz work
  tier: deep_link
  url_template: "https://musicbrainz.org/work/{value}"
  requires_scheme: musicbrainz_work
  applicable_types: [music]
  purpose: verify
  description: "The composition (work) entity, with writer credits and ISWCs"
  authoritative: false

- name: Wikidata
  tier: deep_link
  url_template: "https://www.wikidata.org/wiki/{value}"
  requires_scheme: wikidata
  applicable_types: [music, text, film]
  purpose: verify
  description: "Wikidata item for the work (publication date, composer, lyricist)"
  authoritative: false

- name: MLC public search
  tier: prefilled_search
  url_template: "https://portal.themlc.com/search?query={value}"
  requires_scheme: title
  applicable_types: [music]
  purpose: license
  description: "Publishers, administrators and ownership shares for \"{value}\""
  authoritative: true

- name: ASCAP repertory
  tier: guided_manual
  url_template: "https://www.ascap.com/repertory"
  requires_scheme: title
  applicable_types: [music]
  purpose: license
  description: "Writer and publisher credits"
  navigation_hint: "Search the repertory by title"
  authoritative: true

- name: BMI repertoire
  tier: guided_manual
  url_template: "https://repertoire.bmi.com/"
  requires_scheme: title
  applicable_types: [music]
  purpose: license
  description: "Writer and publisher credits for BMI-affiliated writers"
  navigation_hint: "Search the repertoire by title"
  authoritative: true

# Only emitted when the pipeline sets the `renewal_title` extra, i.e. the
# composition falls in the 1931-1963 renewal window.
- name: Catalog of Copyright Entries (scans)
  tier: guided_manual
  url_template: "https://archive.org/details/copyrightrecords"
  requires_scheme: renewal_title
  applicable_types: [music, text]
  purpose: resolve
  description: "Renewal registrations in the Copyright Office catalog scans on the Internet Archive"
  navigation_hint: "Catalog of Copyright Entries, Third Series, Music; renewals volume for {year}"
  authoritative: true

# Only emitted when the pipeline sets the `renewal_online_title` extra, i.e.
# the renewal window is 1978 or later. Renewals received from 1978 are in the
# Copyright Office's online catalog; the scanned CCE volumes end in 1977 and
# will not contain them.
- name: Copyright Office public catalog
  tier: guided_manual
  url_template: "https://publicrecords.copyright.gov/"
  requires_scheme: renewal_online_title
  applicable_types: [music, text]
  purpose: resolve
  description: "Registrations and renewals received by the US Copyright Office since 1978"
  navigation_hint: "Search by title; look for a renewal (RE-numbered) record received {year} or {year_after} naming this work"
  authoritative: true

# Only emitted when the pipeline sets the `unconfirmed_recording` extra, i.e.
# the recording has no dated session and its year is unconfirmed.
- name: DAHR — Discography of American Historical Recordings
  tier: guided_manual
  url_template: "https://adp.library.ucsb.edu/"
  requires_scheme: unconfirmed_recording
  applicable_types: [music]
  purpose: resolve
  description: "UCSB discography of early recordings, with matrix numbers and session and release dates"
  navigation_hint: "Search by title, then filter by artist {artist}"
  authoritative: true
